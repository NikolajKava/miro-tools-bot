name: Разбор видео из Telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # минимальный интервал, который допускает GitHub
  workflow_dispatch:

# Два одновременных прогона забрали бы одни и те же сообщения из getUpdates.
concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать новые сообщения и скачать видео
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHATS: ${{ vars.TELEGRAM_ALLOWED_CHATS }}
        run: python scripts/poll_telegram.py

      - uses: actions/setup-node@v4
        if: steps.poll.outputs.has_jobs == '1'
        with:
          node-version: "22"

      - name: Поставить ffmpeg, yt-dlp и Claude Code
        if: steps.poll.outputs.has_jobs == '1'
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install --quiet yt-dlp
          npm install -g --silent @anthropic-ai/claude-code

      - name: Подключить Miro MCP
        if: steps.poll.outputs.has_jobs == '1'
        env:
          MIRO_TOKEN: ${{ secrets.MIRO_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          cfg = {"mcpServers": {"miro": {
              "type": "http",
              "url": "https://mcp.miro.com",
              "headers": {"Authorization": f"Bearer {os.environ['MIRO_TOKEN']}"},
          }}}
          with open("mcp.json", "w") as fh:
              json.dump(cfg, fh)
          PY

      - name: Разобрать видео и записать на доску
        if: steps.poll.outputs.has_jobs == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MIRO_BOARD_URL: ${{ vars.MIRO_BOARD_URL }}
        run: python scripts/process.py

      - name: Убрать за собой
        if: always()
        run: rm -f mcp.json
